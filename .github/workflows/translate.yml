name: Gemini Auto Translate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Run Gemini Translation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<EOF
          import os
          from google import genai

          client = genai.Client(api_key=os.environ.get("GEMINI_API_KEY"))

          for root, dirs, files in os.walk("."):
              if ".github" in root:
                  continue
              for file in files:
                  if file.endswith((".md", ".txt")):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, "r", encoding="utf-8") as f:
                              content = f.read()
                          
                          # Gemini에게 기술 문서 번역 요청
                          prompt = f"다음은 기술 문서 또는 마크다운 파일 내용이야. 코드 블록, 명령어, 기술 용어는 원본을 유지하면서 자연스러운 한국어로 번역해 줘. 결과물만 출력해 줘:\n\n{content}"
                          
                          response = client.models.generate_content(
                              model='gemini-2.5-flash',
                              contents=prompt
                          )
                          
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(response.text)
                          print(f"Translated with Gemini: {filepath}")
                      except Exception as e:
                          print(f"Skipped {filepath}: {e}")
          EOF

      - name: Commit and push translated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --cached --quiet || git commit -m "Auto-translate files using Gemini"
          git push
