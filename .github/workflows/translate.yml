name: Gemini Auto Translate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Run Gemini Translation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<EOF
          import os
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise ValueError("GEMINI_API_KEY가 설정되지 않았습니다!")

          client = genai.Client(api_key=api_key)
          print("Gemini 클라이언트 초기화 성공")

          count = 0
          for root, dirs, files in os.walk("."):
              if ".git" in root or ".github" in root:
                  continue
              
              for file in files:
                  if file.endswith(('.md', '.txt')):
                      filepath = os.path.join(root, file)
                      print(f"처리 중: {filepath}")
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                          
                          if not content.strip():
                              continue

                          prompt = f"다음 마크다운/텍스트 문서의 내용을 코드 구조나 명령어는 유지하면서 자연스러운 한국어로 번역해 줘. 결과물만 출력해 줘:\n\n{content}"
                          
                          response = client.models.generate_content(
                              model='gemini-2.5-flash',
                              contents=prompt
                          )
                          
                          if response and response.text:
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(response.text)
                              print(f"-> 번역 완료 및 저장: {filepath}")
                              count += 1
                          else:
                              print(f"-> 번역 실패 (응답 없음): {filepath}")
                      except Exception as e:
                          print(f"-> 에러 발생 ({filepath}): {e}")

          print(f"총 {count}개의 파일 번역 완료")
          EOF

      - name: Commit and push translated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --cached --quiet || git commit -m "Auto-translate files using Gemini"
          git push
